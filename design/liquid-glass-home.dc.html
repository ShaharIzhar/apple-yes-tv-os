<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liquid Glass TV home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#ddd}
</style>
</helmet>
<div tabIndex="0" onKeyDown="{{onKey}}" style="position: relative; width: 1600px; height: 900px; overflow: hidden; background: #000; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif; outline: none">

<path d="M1100 300 C 1110 245 1170 225 1228 245" fill="none" stroke="#ffcf8a" stroke-width="4" opacity=".55"/>
</svg>
</div>

<div style="{{art1}}">
<svg width="1600" height="900" viewBox="0 0 1600 900" aria-hidden="true">
<defs>
<linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050a18"/><stop offset=".6" stop-color="#0f2448"/><stop offset="1" stop-color="#050a14"/></linearGradient>
<radialGradient id="u1" cx=".7" cy=".45" r=".4"><stop offset="0" stop-color="#5b8cff" stop-opacity=".55"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#s1)"/>
<rect width="1600" height="900" fill="url(#u1)"/>
<g fill="#0a1630"><rect x="80" y="430" width="90" height="470"/><rect x="190" y="370" width="70" height="530"/><rect x="280" y="470" width="120" height="430"/><rect x="420" y="400" width="80" height="500"/><rect x="520" y="500" width="140" height="400"/></g>
<g fill="#ffd27a" opacity=".55"><rect x="100" y="460" width="6" height="6"/><rect x="130" y="500" width="6" height="6"/><rect x="210" y="410" width="6" height="6"/><rect x="230" y="470" width="6" height="6"/><rect x="300" y="520" width="6" height="6"/><rect x="350" y="560" width="6" height="6"/><rect x="440" y="440" width="6" height="6"/><rect x="560" y="540" width="6" height="6"/></g>
<g fill="#040912"><circle cx="1160" cy="320" r="92"/><path d="M1160 404 C 1030 412 945 468 905 548 L 870 900 L 1450 900 L 1410 548 C 1372 468 1285 412 1160 404Z"/></g>
<path d="M1075 290 C 1088 230 1150 210 1212 232" fill="none" stroke="#8fb4ff" stroke-width="4" opacity=".55"/>
</svg>
</div>

<div style="{{art2}}">
<svg width="1600" height="900" viewBox="0 0 1600 900" aria-hidden="true">
<defs>
<linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1430"/><stop offset=".45" stop-color="#5a2f6a"/><stop offset=".72" stop-color="#e2876a"/><stop offset="1" stop-color="#1a1226"/></linearGradient>
<radialGradient id="u2" cx=".7" cy=".66" r=".22"><stop offset="0" stop-color="#ffd0a0"/><stop offset="1" stop-color="#ffd0a0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#s2)"/>
<rect width="1600" height="900" fill="url(#u2)"/>
<path d="M0 640 L220 450 L380 560 L600 360 L820 560 L1000 430 L1220 600 L1400 470 L1600 590 L1600 900 L0 900Z" fill="#2c1b3f"/>
<path d="M0 720 L300 560 L520 680 L760 540 L1000 700 L1260 580 L1600 700 L1600 900 L0 900Z" fill="#170f24"/>
</svg>
</div>

<div style="{{art3}}">
<svg width="1600" height="900" viewBox="0 0 1600 900" aria-hidden="true">
<defs>
<linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03101a"/><stop offset=".6" stop-color="#0b2a3a"/><stop offset="1" stop-color="#020a10"/></linearGradient>
<linearGradient id="a3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fe0b0" stop-opacity="0"/><stop offset=".5" stop-color="#3fe0b0" stop-opacity=".55"/><stop offset="1" stop-color="#7a6cff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#s3)"/>
<path d="M-100 380 C 300 160 700 420 1000 220 C 1250 60 1450 200 1700 120 L1700 260 C 1450 340 1250 220 1000 360 C 700 540 300 300 -100 500Z" fill="url(#a3)"/>
<path d="M0 640 L260 560 L480 610 L720 520 L980 600 L1240 540 L1600 610 L1600 900 L0 900Z" fill="#06141c"/>
<g fill="#02080c"><circle cx="1170" cy="340" r="86"/><path d="M1170 418 C 1050 425 965 478 928 552 L 895 900 L 1445 900 L 1410 552 C 1375 478 1290 425 1170 418Z"/></g>
</svg>
</div>

<div style="{{art4}}">
<svg width="1600" height="900" viewBox="0 0 1600 900" aria-hidden="true">
<defs>
<linearGradient id="s4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05050c"/><stop offset=".6" stop-color="#1a1430"/><stop offset="1" stop-color="#05050a"/></linearGradient>
<radialGradient id="u4" cx=".65" cy=".7" r=".45"><stop offset="0" stop-color="#ff9d4a" stop-opacity=".45"/><stop offset="1" stop-color="#ff9d4a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#s4)"/>
<rect width="1600" height="900" fill="url(#u4)"/>
<g fill="#0c0a18"><rect x="620" y="380" width="80" height="520"/><rect x="720" y="300" width="60" height="600"/><rect x="800" y="420" width="110" height="480"/><rect x="930" y="250" width="70" height="650"/><rect x="1020" y="360" width="120" height="540"/><rect x="1160" y="440" width="90" height="460"/><rect x="1270" y="330" width="80" height="570"/><rect x="1370" y="470" width="140" height="430"/></g>
<g fill="#ffcf7a" opacity=".6"><rect x="640" y="420" width="6" height="6"/><rect x="740" y="340" width="6" height="6"/><rect x="760" y="420" width="6" height="6"/><rect x="830" y="470" width="6" height="6"/><rect x="950" y="300" width="6" height="6"/><rect x="960" y="380" width="6" height="6"/><rect x="1050" y="410" width="6" height="6"/><rect x="1100" y="470" width="6" height="6"/><rect x="1190" y="480" width="6" height="6"/><rect x="1290" y="380" width="6" height="6"/><rect x="1400" y="520" width="6" height="6"/></g>
</svg>
</div>

<div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,{{scrim}}) 0%, rgba(0,0,0,0) 58%), linear-gradient(to right, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 45%); pointer-events: none"></div>

<div style="position: absolute; top: 40px; right: 56px; display: flex; gap: 6px; padding: 6px; border-radius: 999px; {{glass}}">
<button aria-label="Inputs" onClick="{{pickInputs}}" style="{{capInputs}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
<button aria-label="Settings" onClick="{{pickSettings}}" style="{{capSettings}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>

<div style="position: absolute; left: 96px; bottom: 330px; max-width: 760px">
<div style="font-size: 64px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.02; margin: 0">{{title}}</div>
<div style="font-size: 20px; letter-spacing: 0.01em; color: rgba(245,245,247,0.74); margin-top: 12px">{{meta}}</div>
</div>

<div style="position: absolute; left: 96px; right: 96px; bottom: 120px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 40px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="5">
<button onClick="{{t.pick}}" aria-label="{{t.name}}" style="{{t.wrap}}">
<div style="{{t.frame}}">
<div style="{{t.plate}}">{{t.name}}</div>
<div style="{{t.sheen}}"></div>
</div>
<div style="{{t.label}}">{{t.name}}</div>
</button>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"glassBlur":{"editor":"range","default":28,"min":0,"max":60,"step":1,"unit":"px","section":"Glass"},"glassTint":{"editor":"range","default":0.1,"min":0,"max":0.4,"step":0.01,"section":"Glass"},"scrim":{"editor":"range","default":0.7,"min":0,"max":1,"step":0.05,"section":"Art"},"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  state = { f: 0, la: 0 };
  renderVals() {
    const blur = this.props.glassBlur ?? 28;
    const tint = this.props.glassTint ?? 0.1;
    const scrim = this.props.scrim ?? 0.7;
    const f = this.state.f, la = this.state.la;
    const apps = [
      { name: 'Netflix', t: 'Desert Run', m: 'Netflix', bg: 'rgba(20,20,20,0.88)', fg: '#e50914', fs: 26 },
      { name: 'yes', t: 'Live Channels', m: 'yes', bg: 'rgba(10,61,143,0.86)', fg: '#ffffff', fs: 38 },
      { name: 'YouTube', t: 'Mountains at Dusk', m: 'YouTube', bg: 'rgba(255,255,255,0.9)', fg: '#c4302b', fs: 26 },
      { name: 'Disney+', t: 'Northern Sky', m: 'Disney+', bg: 'rgba(15,26,46,0.86)', fg: '#e8eefc', fs: 26 },
      { name: 'Spotify', t: 'City Lights', m: 'Spotify', bg: 'rgba(18,18,18,0.88)', fg: '#1ed760', fs: 26 }
    ];
    const glass = `background: rgba(255,255,255,${tint}); backdrop-filter: blur(${blur}px) saturate(180%); -webkit-backdrop-filter: blur(${blur}px) saturate(180%); border: 1px solid rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -1px 0 rgba(255,255,255,0.08), 0 12px 32px rgba(0,0,0,0.3);`;
    const ease = 'cubic-bezier(.2,.9,.3,1)';
    const tiles = apps.map((a, i) => {
      const on = f === i;
      return {
        name: a.name,
        pick: () => this.setState({ f: i, la: i }),
        wrap: `position: relative; display: block; width: 100%; padding: 0; margin: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; transform: ${on ? 'translateY(-10px) scale(1.1)' : 'none'}; transition: transform 450ms ${ease}; z-index: ${on ? 2 : 1}`,
        frame: `position: relative; aspect-ratio: 5 / 3; border-radius: 26px; padding: 7px; box-sizing: border-box; overflow: hidden; background: rgba(255,255,255,${on ? tint + 0.08 : tint}); backdrop-filter: blur(${blur}px) saturate(180%); -webkit-backdrop-filter: blur(${blur}px) saturate(180%); border: 1px solid rgba(255,255,255,${on ? 0.45 : 0.2}); box-shadow: inset 0 1.5px 0 rgba(255,255,255,${on ? 0.8 : 0.45}), inset 0 -1px 0 rgba(255,255,255,0.1), 0 ${on ? 30 : 10}px ${on ? 60 : 24}px rgba(0,0,0,${on ? 0.55 : 0.3}); transition: box-shadow 450ms ${ease}, border-color 300ms, background 300ms`,
        plate: `width: 100%; height: 100%; border-radius: 19px; display: flex; align-items: center; justify-content: center; background: ${a.bg}; color: ${a.fg}; font-size: ${a.fs}px; font-weight: 700; letter-spacing: -0.01em`,
        sheen: `position: absolute; inset: 0; border-radius: 26px; pointer-events: none; background: linear-gradient(125deg, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.08) 32%, rgba(255,255,255,0) 55%); opacity: ${on ? 1 : 0.25}; transition: opacity 350ms`,
        label: `position: absolute; left: 0; right: 0; top: calc(100% + 18px); text-align: center; font-size: 20px; font-weight: 500; color: #f5f5f7; opacity: ${on ? 1 : 0}; transition: opacity 250ms ${on ? '120ms' : '0ms'}`
      };
    });
    const art = (i) => `position: absolute; inset: 0; opacity: ${la === i ? 1 : 0}; transition: opacity 600ms cubic-bezier(.2,0,0,1)`;
    const cap = (on) => `width: 52px; height: 52px; border-radius: 999px; border: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; color: ${on ? '#111' : '#f5f5f7'}; background: ${on ? 'rgba(255,255,255,0.92)' : 'transparent'}; transform: ${on ? 'scale(1.08)' : 'none'}; transition: background 250ms, color 250ms, transform 350ms ${ease}`;
    const onKey = (e) => {
      const k = e.key; let n = f;
      if (k === 'ArrowRight') n = f < 5 ? Math.min(4, f + 1) : 6;
      else if (k === 'ArrowLeft') n = f < 5 ? Math.max(0, f - 1) : 5;
      else if (k === 'ArrowUp') n = f < 5 ? 5 : f;
      else if (k === 'ArrowDown') n = f >= 5 ? la : f;
      else return;
      e.preventDefault();
      this.setState({ f: n, la: n < 5 ? n : la });
    };
    return {
      onKey, tiles, glass, scrim,
      title: apps[la].t, meta: apps[la].m,
      art0: art(0), art1: art(1), art2: art(2), art3: art(3), art4: art(4),
      capInputs: cap(f === 5), capSettings: cap(f === 6),
      pickInputs: () => this.setState({ f: 5 }),
      pickSettings: () => this.setState({ f: 6 })
    };
  }
}
</script>
</body>
</html>
